  <text x="198" y="390" font-size="24" fill="#1E3A63">Bạn tắt hết âm thanh</text>
  <circle cx="170" cy="443" r="8" fill="#1f8b3f"/>
  <text x="198" y="452" font-size="24" fill="#1E3A63">Bạn bấm giờ 3 phút</text>
