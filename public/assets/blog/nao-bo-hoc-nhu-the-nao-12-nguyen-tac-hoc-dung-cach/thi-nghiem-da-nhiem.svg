  <text x="898" y="452" font-size="24" fill="#1E3A63">Bạn bấm giờ 3 phút</text>
  <circle cx="870" cy="505" r="8" fill="#2e86c9"/>
  <text x="898" y="514" font-size="24" fill="#1E3A63">Bạn ghi thời gian và số câu đúng</text>
