  <rect x="820" y="180" width="660" height="420" rx="30" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <rect x="820" y="180" width="660" height="86" rx="30" fill="#2e86c9"/>
  <rect x="820" y="236" width="660" height="30" fill="#2e86c9"/>
  <text x="1150" y="220" text-anchor="middle" font-size="28" font-weight="bold" fill="#ffffff">VÒNG 2</text>
  <text x="1150" y="254" text-anchor="middle" font-size="23" fill="#eaf4ff">Bật nhạc có lời</text>
  <circle cx="870" cy="319" r="8" fill="#2e86c9"/>
