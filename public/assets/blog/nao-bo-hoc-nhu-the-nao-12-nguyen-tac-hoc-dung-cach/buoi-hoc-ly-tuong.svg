  <text x="800" y="78" text-anchor="middle" font-size="39" font-weight="bold" fill="#1E3A63">Một buổi học 60 phút xếp theo cách não bộ hoạt động</text>
  <text x="800" y="124" text-anchor="middle" font-size="24" fill="#75849a">Sự tập trung tụt xuống sau khoảng mười phút, nên buổi học cần đổi nhịp</text>
  <rect x="110" y="210" width="260" height="200" rx="26" fill="#1f8b3f"/>
  <text x="240" y="274" text-anchor="middle" font-size="40" font-weight="bold" fill="#ffffff">10</text>
  <text x="240" y="308" text-anchor="middle" font-size="20" fill="#ffffff" opacity="0.85">phút</text>
  <text x="240" y="356" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">Vận động nhẹ</text>
  <text x="240" y="386" text-anchor="middle" font-size="19" fill="#ffffff" opacity="0.9">và đặt câu hỏi</text>
  <rect x="390" y="210" width="260" height="200" rx="26" fill="#2e86c9"/>
  <text x="520" y="274" text-anchor="middle" font-size="40" font-weight="bold" fill="#ffffff">20</text>
  <text x="520" y="308" text-anchor="middle" font-size="20" fill="#ffffff" opacity="0.85">phút</text>
  <text x="520" y="356" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">Học phần khó</text>
  <text x="520" y="386" text-anchor="middle" font-size="19" fill="#ffffff" opacity="0.9">lúc còn tỉnh nhất</text>
  <rect x="670" y="210" width="260" height="200" rx="26" fill="#F2C13D"/>
  <text x="800" y="274" text-anchor="middle" font-size="40" font-weight="bold" fill="#13294a">5</text>
  <text x="800" y="308" text-anchor="middle" font-size="20" fill="#13294a" opacity="0.85">phút</text>
  <text x="800" y="356" text-anchor="middle" font-size="22" font-weight="bold" fill="#13294a">Nghỉ ngắn</text>
  <text x="800" y="386" text-anchor="middle" font-size="19" fill="#13294a" opacity="0.9">không mở điện thoại</text>
  <rect x="950" y="210" width="260" height="200" rx="26" fill="#2e86c9"/>
  <text x="1080" y="274" text-anchor="middle" font-size="40" font-weight="bold" fill="#ffffff">20</text>
  <text x="1080" y="308" text-anchor="middle" font-size="20" fill="#ffffff" opacity="0.85">phút</text>
  <text x="1080" y="356" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">Đổi hoạt động</text>
  <text x="1080" y="386" text-anchor="middle" font-size="19" fill="#ffffff" opacity="0.9">làm bài, vẽ sơ đồ</text>
  <rect x="1230" y="210" width="260" height="200" rx="26" fill="#1f8b3f"/>
  <text x="1360" y="274" text-anchor="middle" font-size="40" font-weight="bold" fill="#ffffff">5</text>
  <text x="1360" y="308" text-anchor="middle" font-size="20" fill="#ffffff" opacity="0.85">phút</text>
  <text x="1360" y="356" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">Nhắc lại 3 ý</text>
  <text x="1360" y="386" text-anchor="middle" font-size="19" fill="#ffffff" opacity="0.9">bằng lời của mình</text>
  <rect x="300" y="462" width="1000" height="86" rx="26" fill="#ffffff" stroke="#F2C13D" stroke-width="3"/>
  <text x="800" y="514" text-anchor="middle" font-size="26" font-weight="bold" fill="#1E3A63">Bạn xếp môn khó vào 20 phút đầu, không để dành tới cuối buổi</text>
  <text x="800" y="602" text-anchor="middle" font-size="22" fill="#75849a">Cô Thi Lập Trình  |  cothilaptrinh.vn</text>
