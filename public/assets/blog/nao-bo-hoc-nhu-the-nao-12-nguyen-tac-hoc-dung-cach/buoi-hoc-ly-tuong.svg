<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 630" width="1600" height="630" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">
  <rect width="1600" height="630" rx="28" fill="#f6f9fc"/>
