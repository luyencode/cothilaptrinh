<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" font-family="'DejaVu Sans', Arial, sans-serif">
  <rect x="0" y="0" width="1600" height="680" rx="28" fill="#f6f9fc"/>
  <text x="800" y="86" text-anchor="middle" font-size="38" font-weight="bold" fill="#1E3A63">Công nghệ lõi: nghề không teo lại, nghề nâng chuẩn lên</text>

  <!-- code window -->
  <rect x="130" y="180" width="480" height="360" rx="26" fill="#13294a"/>
  <circle cx="172" cy="222" r="8" fill="#F2C13D"/>
  <circle cx="198" cy="222" r="8" fill="#1f8b3f"/>
  <circle cx="224" cy="222" r="8" fill="#62b4ec"/>
  <rect x="180" y="270" width="300" height="18" rx="9" fill="#62b4ec"/>
  <rect x="180" y="308" width="360" height="18" rx="9" fill="#1f8b3f"/>
  <rect x="220" y="346" width="280" height="18" rx="9" fill="#2e86c9"/>
  <rect x="220" y="384" width="220" height="18" rx="9" fill="#F2C13D"/>
