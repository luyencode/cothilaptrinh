  <polyline points="740,470 830,440 920,390 1010,330 1100,270" fill="none" stroke="#1f8b3f" stroke-width="10" stroke-linecap="round"/>
  <circle cx="1100" cy="270" r="14" fill="#1f8b3f"/>
  <path d="M1084 236 L1128 246 L1100 282 Z" fill="#1f8b3f" opacity="0"/>
  <text x="920" y="510" text-anchor="middle" font-size="21" fill="#75849a">kỹ sư AI, học máy, phát triển ứng dụng</text>

  <!-- requirement card -->
  <rect x="1230" y="180" width="260" height="360" rx="26" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <rect x="1275" y="230" width="170" height="56" rx="16" fill="#eef7f0"/>
  <text x="1360" y="266" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f8b3f">Thuật toán</text>
  <rect x="1275" y="306" width="170" height="56" rx="16" fill="#eef4fb"/>
  <text x="1360" y="342" text-anchor="middle" font-size="21" font-weight="bold" fill="#2e86c9">CTDL</text>
  <rect x="1275" y="382" width="170" height="56" rx="16" fill="#fdf7e6"/>
  <text x="1360" y="418" text-anchor="middle" font-size="21" font-weight="bold" fill="#b8860b">Dự án thật</text>
  <text x="1360" y="500" text-anchor="middle" font-size="21" fill="#75849a">nền cần xây sớm</text>
