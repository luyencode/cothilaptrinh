  <rect x="951" y="380" width="272" height="180" rx="22" fill="#62b4ec"/>
  <text x="1087" y="458" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">Robot,</text>
  <text x="1087" y="492" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">tự động hóa</text>

  <rect x="1243" y="380" width="272" height="180" rx="22" fill="#2e86c9"/>
  <text x="1379" y="458" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">Truyền thông,</text>
