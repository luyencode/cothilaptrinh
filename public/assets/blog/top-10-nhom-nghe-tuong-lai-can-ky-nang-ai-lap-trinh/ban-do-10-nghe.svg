<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" font-family="'DejaVu Sans', Arial, sans-serif">
  <rect x="0" y="0" width="1600" height="680" rx="28" fill="#f6f9fc"/>
  <text x="800" y="80" text-anchor="middle" font-size="38" font-weight="bold" fill="#1E3A63">Bản đồ 10 nhóm nghề tương lai</text>
  <text x="800" y="122" text-anchor="middle" font-size="22" fill="#75849a">nhóm nào cũng ưu ái người có nền công nghệ</text>

  <!-- row 1 -->
  <rect x="75" y="170" width="272" height="180" rx="22" fill="#1f8b3f"/>
  <text x="211" y="248" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">Kỹ sư AI,</text>
  <text x="211" y="282" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">học máy</text>

  <rect x="367" y="170" width="272" height="180" rx="22" fill="#2e86c9"/>
  <text x="503" y="248" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">Phát triển</text>
  <text x="503" y="282" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">phần mềm</text>

  <rect x="659" y="170" width="272" height="180" rx="22" fill="#1E3A63"/>
  <text x="795" y="248" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">Phân tích</text>
  <text x="795" y="282" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">dữ liệu</text>

  <rect x="951" y="170" width="272" height="180" rx="22" fill="#62b4ec"/>
  <text x="1087" y="248" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">Dữ liệu lớn</text>
  <text x="1087" y="282" text-anchor="middle" font-size="21" fill="#f6f9fc">kho dữ liệu khổng lồ</text>

  <rect x="1243" y="170" width="272" height="180" rx="22" fill="#1f8b3f"/>
  <text x="1379" y="248" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">An ninh</text>
  <text x="1379" y="282" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">mạng</text>

  <!-- row 2 -->
  <rect x="75" y="380" width="272" height="180" rx="22" fill="#2e86c9"/>
  <text x="211" y="458" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">Fintech</text>
  <text x="211" y="492" text-anchor="middle" font-size="21" fill="#f6f9fc">tài chính số</text>

  <rect x="367" y="380" width="272" height="180" rx="22" fill="#1E3A63"/>
  <text x="503" y="458" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">Y tế số</text>
  <text x="503" y="492" text-anchor="middle" font-size="21" fill="#dbe7f3">y học + dữ liệu</text>

  <rect x="659" y="380" width="272" height="180" rx="22" fill="#1f8b3f"/>
  <text x="795" y="444" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">Nông nghiệp</text>
  <text x="795" y="478" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">công nghệ cao</text>
