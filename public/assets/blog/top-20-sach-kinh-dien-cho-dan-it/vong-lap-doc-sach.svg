<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" width="1600" height="620" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1600" height="620" rx="28" fill="#f6f9fc"/>
<rect x="70" y="54" width="16" height="16" rx="4" fill="#1f8b3f"/>
<rect x="91" y="54" width="16" height="16" rx="4" fill="#2e86c9"/>
<rect x="70" y="75" width="16" height="16" rx="4" fill="#2e86c9"/>
<rect x="91" y="75" width="16" height="16" rx="4" fill="#1f8b3f"/>
<text x="135" y="82" font-size="24" fill="#1E3A63" font-weight="700" text-anchor="start">Cô Thi Lập Trình</text>
<text x="70" y="152" font-size="38" fill="#1E3A63" font-weight="800" text-anchor="start">Vòng lặp đọc một chương sách kỹ thuật</text>
<text x="70" y="192" font-size="23" fill="#75849a" font-weight="400" text-anchor="start">Bốn bước này biến phần chữ bạn đã đọc thành kỹ năng bạn giữ lại được</text>
<rect x="72" y="250" width="352" height="250" rx="24" fill="#ffffff" stroke="#e9ecf2"/>
<circle cx="124" cy="308" r="24" fill="#1f8b3f" opacity="0.15"/>
<text x="124" y="316" font-size="24" fill="#1f8b3f" font-weight="800" text-anchor="middle">1</text>
<text x="98" y="382" font-size="23" fill="#1E3A63" font-weight="700" text-anchor="start">Bạn đọc một chương</text>
<text x="98" y="426" font-size="19" fill="#75849a" font-weight="400" text-anchor="start">Bạn đọc liền mạch, chưa ghi chép</text>
<path d="M 427 367 l 10 8 l -10 8" fill="none" stroke="#75849a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="440" y="250" width="352" height="250" rx="24" fill="#ffffff" stroke="#e9ecf2"/>
<circle cx="492" cy="308" r="24" fill="#2e86c9" opacity="0.15"/>
<text x="492" y="316" font-size="24" fill="#2e86c9" font-weight="800" text-anchor="middle">2</text>
<text x="466" y="382" font-size="23" fill="#1E3A63" font-weight="700" text-anchor="start">Bạn viết lại năm dòng</text>
<text x="466" y="426" font-size="19" fill="#75849a" font-weight="400" text-anchor="start">Bạn diễn đạt lại bằng lời của mình</text>
<path d="M 795 367 l 10 8 l -10 8" fill="none" stroke="#75849a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="808" y="250" width="352" height="250" rx="24" fill="#ffffff" stroke="#e9ecf2"/>
<circle cx="860" cy="308" r="24" fill="#1E3A63" opacity="0.15"/>
<text x="860" y="316" font-size="24" fill="#1E3A63" font-weight="800" text-anchor="middle">3</text>
<text x="834" y="382" font-size="23" fill="#1E3A63" font-weight="700" text-anchor="start">Bạn gõ lại ví dụ</text>
<text x="834" y="426" font-size="19" fill="#75849a" font-weight="400" text-anchor="start">Bạn tự gõ code, không sao chép</text>
<path d="M 1163 367 l 10 8 l -10 8" fill="none" stroke="#75849a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1176" y="250" width="352" height="250" rx="24" fill="#ffffff" stroke="#e9ecf2"/>
<circle cx="1228" cy="308" r="24" fill="#F2C13D" opacity="0.15"/>
<text x="1228" y="316" font-size="24" fill="#F2C13D" font-weight="800" text-anchor="middle">4</text>
<text x="1202" y="382" font-size="23" fill="#1E3A63" font-weight="700" text-anchor="start">Bạn làm một bài tập</text>
<text x="1202" y="426" font-size="19" fill="#75849a" font-weight="400" text-anchor="start">Bạn nộp bài và nhận điểm ngay</text>
<path d="M 1500 508 q 40 60 -20 60 L 130 568 q -60 0 -20 -60" fill="none" stroke="#75849a" stroke-width="3" stroke-dasharray="8 8"/>
<text x="800" y="560" font-size="20" fill="#75849a" font-weight="600" text-anchor="middle">Bạn quay lại với chương tiếp theo</text>
</svg>
