<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" font-family="'DejaVu Sans', Arial, sans-serif">
  <rect x="0" y="0" width="1600" height="680" rx="28" fill="#f6f9fc"/>
  <text x="800" y="90" text-anchor="middle" font-size="38" font-weight="bold" fill="#1E3A63">Lớp 9: luyện đề và chiến thuật phòng thi</text>

  <!-- Exam paper -->
  <rect x="140" y="170" width="400" height="380" rx="26" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <rect x="140" y="170" width="400" height="70 " rx="26" fill="#1E3A63"/>
  <rect x="140" y="210" width="400" height="30" fill="#1E3A63"/>
  <text x="340" y="216" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">ĐỀ THI THỬ</text>
  <text x="200" y="300" font-size="24" font-weight="bold" fill="#1f8b3f">Bài 1</text>
  <rect x="290" y="284" width="200" height="16" rx="8" fill="#e9ecf2"/>
  <text x="200" y="370" font-size="24" font-weight="bold" fill="#2e86c9">Bài 2</text>
  <rect x="290" y="354" width="160" height="16" rx="8" fill="#e9ecf2"/>
  <text x="200" y="440" font-size="24" font-weight="bold" fill="#F2C13D">Bài 3</text>
  <rect x="290" y="424" width="180" height="16" rx="8" fill="#e9ecf2"/>
  <text x="340" y="510" text-anchor="middle" font-size="22" fill="#75849a">dễ làm trước, khó làm sau</text>

  <!-- Clock -->
  <rect x="620" y="170" width="340" height="380" rx="26" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <circle cx="790" cy="320" r="95" fill="#fdf7e6" stroke="#F2C13D" stroke-width="6"/>
  <line x1="790" y1="320" x2="790" y2="252" stroke="#1E3A63" stroke-width="8" stroke-linecap="round"/>
  <line x1="790" y1="320" x2="842" y2="344" stroke="#1E3A63" stroke-width="8" stroke-linecap="round"/>
  <circle cx="790" cy="320" r="10" fill="#1E3A63"/>
  <text x="790" y="480" text-anchor="middle" font-size="24" font-weight="bold" fill="#1E3A63">Đúng giờ thi thật</text>

  <!-- Subtask points -->
  <rect x="1040" y="170" width="420" height="380" rx="26" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <text x="1250" y="234" text-anchor="middle" font-size="26" font-weight="bold" fill="#1E3A63">Điểm theo nhóm test</text>
  <rect x="1100" y="270" width="300" height="52" rx="14" fill="#1f8b3f"/>
  <text x="1250" y="304" text-anchor="middle" font-size="22" fill="#ffffff">Test dễ: ăn chắc</text>
  <rect x="1100" y="340" width="300" height="52" rx="14" fill="#2e86c9"/>
  <text x="1250" y="374" text-anchor="middle" font-size="22" fill="#ffffff">Test vừa: cố gắng</text>
  <rect x="1100" y="410" width="300" height="52" rx="14" fill="#e9ecf2"/>
  <text x="1250" y="444" text-anchor="middle" font-size="22" fill="#75849a">Test khó: nếu còn giờ</text>
  <text x="1250" y="516" text-anchor="middle" font-size="22" fill="#75849a">không để rơi điểm phần dễ</text>

  <text x="800" y="614" text-anchor="middle" font-size="24" fill="#75849a">Đề thật các năm trước, thi thử theo giờ và bộ test tự tạo</text>
</svg>
