<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" font-family="'DejaVu Sans', Arial, sans-serif">
  <rect x="0" y="0" width="1600" height="680" rx="28" fill="#f6f9fc"/>
  <text x="800" y="86" text-anchor="middle" font-size="40" font-weight="bold" fill="#1E3A63">Ba giai đoạn tới kỳ thi chuyên Tin</text>
  <text x="800" y="130" text-anchor="middle" font-size="24" fill="#75849a">Mỗi năm một trọng tâm, không dồn vào lớp 9</text>

  <!-- Card lop 6-7 -->
  <rect x="70" y="180" width="380" height="360" rx="26" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <rect x="70" y="180" width="380" height="86" rx="26" fill="#1f8b3f"/>
  <rect x="70" y="230" width="380" height="36" fill="#1f8b3f"/>
  <text x="260" y="235" text-anchor="middle" font-size="34" font-weight="bold" fill="#ffffff">LỚP 6-7</text>
  <text x="260" y="316" text-anchor="middle" font-size="26" font-weight="bold" fill="#1E3A63">Xây nền tư duy</text>
  <rect x="110" y="348" width="14" height="14" rx="4" fill="#1f8b3f"/>
  <text x="140" y="362" font-size="22" fill="#1E3A63">Scratch làm quen khối lệnh</text>
  <rect x="110" y="398" width="14" height="14" rx="4" fill="#1f8b3f"/>
  <text x="140" y="412" font-size="22" fill="#1E3A63">Python hoặc C++ đầu tiên</text>
  <rect x="110" y="448" width="14" height="14" rx="4" fill="#1f8b3f"/>
  <text x="140" y="462" font-size="22" fill="#1E3A63">Toán tư duy logic</text>

  <!-- Arrow 1 -->
  <line x1="470" y1="360" x2="530" y2="360" stroke="#75849a" stroke-width="6" stroke-linecap="round"/>
  <path d="M530 344 L560 360 L530 376 Z" fill="#75849a"/>

  <!-- Card lop 8 -->
  <rect x="580" y="180" width="380" height="360" rx="26" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <rect x="580" y="180" width="380" height="86" rx="26" fill="#2e86c9"/>
  <rect x="580" y="230" width="380" height="36" fill="#2e86c9"/>
  <text x="770" y="235" text-anchor="middle" font-size="34" font-weight="bold" fill="#ffffff">LỚP 8</text>
  <text x="770" y="316" text-anchor="middle" font-size="26" font-weight="bold" fill="#1E3A63">C++ và thuật toán</text>
  <rect x="620" y="348" width="14" height="14" rx="4" fill="#2e86c9"/>
  <text x="650" y="362" font-size="22" fill="#1E3A63">Sắp xếp, tìm kiếm, đệ quy</text>
  <rect x="620" y="398" width="14" height="14" rx="4" fill="#2e86c9"/>
  <text x="650" y="412" font-size="22" fill="#1E3A63">Độ phức tạp thuật toán</text>
  <rect x="620" y="448" width="14" height="14" rx="4" fill="#2e86c9"/>
  <text x="650" y="462" font-size="22" fill="#1E3A63">Làm quen máy chấm tự động</text>

  <!-- Arrow 2 -->
  <line x1="980" y1="360" x2="1040" y2="360" stroke="#75849a" stroke-width="6" stroke-linecap="round"/>
  <path d="M1040 344 L1070 360 L1040 376 Z" fill="#75849a"/>

  <!-- Card lop 9 -->
  <rect x="1090" y="180" width="380" height="360" rx="26" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <rect x="1090" y="180" width="380" height="86" rx="26" fill="#1E3A63"/>
  <rect x="1090" y="230" width="380" height="36" fill="#1E3A63"/>
  <text x="1280" y="235" text-anchor="middle" font-size="34" font-weight="bold" fill="#F2C13D">LỚP 9</text>
  <text x="1280" y="316" text-anchor="middle" font-size="26" font-weight="bold" fill="#1E3A63">Luyện đề, chiến thuật</text>
  <rect x="1130" y="348" width="14" height="14" rx="4" fill="#F2C13D"/>
  <text x="1160" y="362" font-size="22" fill="#1E3A63">Đề thi thật các năm trước</text>
  <rect x="1130" y="398" width="14" height="14" rx="4" fill="#F2C13D"/>
  <text x="1160" y="412" font-size="22" fill="#1E3A63">Thi thử đúng thời gian</text>
  <rect x="1130" y="448" width="14" height="14" rx="4" fill="#F2C13D"/>
  <text x="1160" y="462" font-size="22" fill="#1E3A63">Kiếm điểm từng phần</text>

  <!-- Finish banner -->
  <rect x="440" y="580" width="720" height="66" rx="22" fill="#1f8b3f"/>
  <text x="800" y="623" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">Đích đến: chuyên Tin và HSG Tin học</text>
</svg>
