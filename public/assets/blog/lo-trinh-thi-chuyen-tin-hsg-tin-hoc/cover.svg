<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="'DejaVu Sans', Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#f6f9fc"/>
  <circle cx="1150" cy="-40" r="220" fill="#eef7f0"/>
  <circle cx="40" cy="660" r="180" fill="#eef4fb"/>

  <!-- Logo monogram -->
  <rect x="60" y="52" width="34" height="34" rx="9" fill="#1f8b3f"/>
  <text x="77" y="77" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">C</text>
  <rect x="100" y="52" width="34" height="34" rx="9" fill="#2e86c9"/>
  <text x="117" y="77" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">T</text>
  <rect x="60" y="92" width="34" height="34" rx="9" fill="#2e86c9"/>
  <text x="77" y="117" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">L</text>
  <rect x="100" y="92" width="34" height="34" rx="9" fill="#1f8b3f"/>
  <text x="117" y="117" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">T</text>
  <text x="152" y="82" font-size="26" font-weight="bold" fill="#1f8b3f">Cô Thi</text>
  <text x="152" y="116" font-size="26" font-weight="bold" fill="#2e86c9">Lập Trình</text>

  <!-- Title -->
  <text x="60" y="248" font-size="58" font-weight="bold" fill="#1E3A63">Lộ trình thi</text>
  <text x="60" y="326" font-size="58" font-weight="bold" fill="#1f8b3f">chuyên Tin</text>
  <text x="60" y="404" font-size="58" font-weight="bold" fill="#1E3A63">và HSG Tin học</text>
  <text x="60" y="470" font-size="30" fill="#75849a">Bắt đầu từ lớp mấy là vừa?</text>

  <rect x="60" y="520" width="330" height="56" rx="18" fill="#1E3A63"/>
  <text x="225" y="557" text-anchor="middle" font-size="24" font-weight="bold" fill="#F2C13D">cothilaptrinh.vn</text>

  <!-- Illustration: steps to trophy -->
  <rect x="760" y="440" width="120" height="110" rx="18" fill="#1f8b3f"/>
  <text x="820" y="505" text-anchor="middle" font-size="30" font-weight="bold" fill="#ffffff">6-7</text>
  <rect x="900" y="360" width="120" height="190" rx="18" fill="#2e86c9"/>
  <text x="960" y="445" text-anchor="middle" font-size="30" font-weight="bold" fill="#ffffff">8</text>
  <rect x="1040" y="280" width="120" height="270" rx="18" fill="#1E3A63"/>
  <text x="1100" y="405" text-anchor="middle" font-size="30" font-weight="bold" fill="#F2C13D">9</text>

  <!-- Trophy above last step -->
  <circle cx="1100" cy="196" r="52" fill="#fdf7e6" stroke="#F2C13D" stroke-width="5"/>
  <path d="M1078 176 h44 v18 a22 22 0 0 1 -44 0 Z" fill="#F2C13D"/>
  <rect x="1094" y="212" width="12" height="12" fill="#F2C13D"/>
  <rect x="1084" y="224" width="32" height="8" rx="3" fill="#F2C13D"/>

  <!-- Flag on first step -->
  <line x1="820" y1="380" x2="820" y2="440" stroke="#1E3A63" stroke-width="6" stroke-linecap="round"/>
  <path d="M820 380 L866 394 L820 408 Z" fill="#F2C13D"/>
</svg>
