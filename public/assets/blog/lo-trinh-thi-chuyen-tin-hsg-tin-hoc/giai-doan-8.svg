<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" font-family="'DejaVu Sans', Arial, sans-serif">
  <rect x="0" y="0" width="1600" height="680" rx="28" fill="#f6f9fc"/>
  <text x="800" y="90" text-anchor="middle" font-size="38" font-weight="bold" fill="#1E3A63">Lớp 8: C++ và thuật toán căn bản</text>

  <!-- C++ code window -->
  <rect x="110" y="170" width="520" height="380" rx="26" fill="#13294a"/>
  <circle cx="152" cy="212" r="8" fill="#F2C13D"/>
  <circle cx="178" cy="212" r="8" fill="#1f8b3f"/>
  <circle cx="204" cy="212" r="8" fill="#62b4ec"/>
  <rect x="470" y="192" width="130" height="40" rx="12" fill="#2e86c9"/>
  <text x="535" y="219" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">C++</text>
  <rect x="160" y="270" width="300" height="18" rx="9" fill="#62b4ec"/>
  <rect x="160" y="308" width="380" height="18" rx="9" fill="#1f8b3f"/>
  <rect x="200" y="346" width="300" height="18" rx="9" fill="#2e86c9"/>
  <rect x="200" y="384" width="240" height="18" rx="9" fill="#F2C13D"/>
  <rect x="240" y="422" width="260" height="18" rx="9" fill="#62b4ec"/>
  <rect x="160" y="460" width="200" height="18" rx="9" fill="#1f8b3f"/>

  <!-- Sorting bars -->
  <rect x="700" y="170" width="420" height="380" rx="26" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <text x="910" y="230" text-anchor="middle" font-size="26" font-weight="bold" fill="#1E3A63">Sắp xếp và tìm kiếm</text>
  <rect x="760" y="420" width="50" height="80" rx="10" fill="#62b4ec"/>
  <rect x="825" y="380" width="50" height="120" rx="10" fill="#2e86c9"/>
  <rect x="890" y="330" width="50" height="170" rx="10" fill="#1f8b3f"/>
  <rect x="955" y="290" width="50" height="210" rx="10" fill="#2e86c9"/>
  <rect x="1020" y="260" width="50" height="240" rx="10" fill="#1E3A63"/>

  <!-- Complexity badge -->
  <rect x="1190" y="170" width="300" height="380" rx="26" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <circle cx="1340" cy="300" r="88" fill="#eef4fb" stroke="#2e86c9" stroke-width="4"/>
  <text x="1340" y="292" text-anchor="middle" font-size="26" font-weight="bold" fill="#2e86c9">O(n log n)</text>
  <text x="1340" y="330" text-anchor="middle" font-size="21" fill="#75849a">hay O(n^2)?</text>
  <text x="1340" y="440" text-anchor="middle" font-size="24" font-weight="bold" fill="#1E3A63">Độ phức tạp</text>
  <text x="1340" y="476" text-anchor="middle" font-size="21" fill="#75849a">nhanh hay chậm,</text>
  <text x="1340" y="506" text-anchor="middle" font-size="21" fill="#75849a">biết trước khi viết</text>

  <text x="800" y="614" text-anchor="middle" font-size="24" fill="#75849a">Mảng, xâu, đệ quy, cấu trúc dữ liệu và những bài nộp đầu tiên lên máy chấm</text>
</svg>
