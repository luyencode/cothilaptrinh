<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" font-family="'DejaVu Sans', Arial, sans-serif">
  <rect x="0" y="0" width="1600" height="680" rx="28" fill="#f6f9fc"/>
  <text x="800" y="90" text-anchor="middle" font-size="38" font-weight="bold" fill="#1E3A63">Nhóm lỗi quên trường hợp biên</text>
  <rect x="130" y="200" width="320" height="300" rx="26" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <rect x="130" y="200" width="320" height="14" rx="7" fill="#62b4ec"/>
  <text x="290" y="320" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E3A63">n = 0</text>
  <text x="290" y="380" text-anchor="middle" font-size="23" fill="#75849a">dữ liệu rỗng</text>
  <rect x="480" y="200" width="320" height="300" rx="26" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <rect x="480" y="200" width="320" height="14" rx="7" fill="#2e86c9"/>
  <text x="640" y="320" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E3A63">n = 1</text>
  <text x="640" y="380" text-anchor="middle" font-size="23" fill="#75849a">chỉ một phần tử</text>
  <rect x="830" y="200" width="320" height="300" rx="26" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <rect x="830" y="200" width="320" height="14" rx="7" fill="#F2C13D"/>
  <text x="990" y="320" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E3A63">không có</text>
  <text x="990" y="380" text-anchor="middle" font-size="23" fill="#75849a">không kết quả nào</text>
  <rect x="1180" y="200" width="320" height="300" rx="26" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <rect x="1180" y="200" width="320" height="14" rx="7" fill="#1f8b3f"/>
  <text x="1340" y="320" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E3A63">tất cả bằng nhau</text>
  <text x="1340" y="380" text-anchor="middle" font-size="23" fill="#75849a">mọi giá trị giống hệt</text>
  <text x="800" y="555" text-anchor="middle" font-size="26" fill="#1E3A63">Bốn bộ dữ liệu này thử mất một phút, cứu được cả nhóm test</text>
  <text x="800" y="620" text-anchor="middle" font-size="24" fill="#75849a">Đề luôn nói rõ ở phần Kết quả ra, và đó là chỗ hay bị đọc lướt</text>
</svg>
