<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" font-family="'DejaVu Sans', Arial, sans-serif">
  <rect x="0" y="0" width="1600" height="680" rx="28" fill="#f6f9fc"/>
  <text x="800" y="90" text-anchor="middle" font-size="38" font-weight="bold" fill="#1E3A63">Nhóm lỗi kiểu số và thời gian chạy</text>
  <rect x="110" y="170" width="660" height="370" rx="26" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <text x="440" y="235" text-anchor="middle" font-size="28" font-weight="bold" fill="#1E3A63">Tràn số</text>
  <rect x="170" y="275" width="540" height="72" rx="16" fill="#f6f9fc"/>
  <text x="440" y="322" text-anchor="middle" font-size="26" fill="#1E3A63">int: tới khoảng 2 tỷ</text>
  <rect x="170" y="365" width="540" height="72" rx="16" fill="#fdecec"/>
  <text x="440" y="412" text-anchor="middle" font-size="26" fill="#d64545">2000000000 x 3 = số âm</text>
  <rect x="170" y="455" width="540" height="60" rx="16" fill="#eef7f1"/>
  <text x="440" y="495" text-anchor="middle" font-size="26" fill="#1f8b3f">dùng long long là xong</text>
  <rect x="830" y="170" width="660" height="370" rx="26" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <text x="1160" y="235" text-anchor="middle" font-size="28" font-weight="bold" fill="#1E3A63">Quá thời gian</text>
  <rect x="900" y="420" width="110" height="60" rx="12" fill="#1f8b3f"/>
  <text x="955" y="510" text-anchor="middle" font-size="21" fill="#75849a">n = 1.000</text>
  <rect x="1090" y="330" width="110" height="150" rx="12" fill="#F2C13D"/>
  <text x="1145" y="510" text-anchor="middle" font-size="21" fill="#75849a">n = 100.000</text>
  <rect x="1280" y="180" width="110" height="300" rx="12" fill="#d64545"/>
  <text x="1335" y="510" text-anchor="middle" font-size="21" fill="#75849a">n = 1.000.000</text>
  <text x="1160" y="290" text-anchor="middle" font-size="24" fill="#75849a">hai vòng lặp lồng nhau tốn bao nhiêu phép tính</text>
  <text x="800" y="620" text-anchor="middle" font-size="24" fill="#75849a">Ước lượng trước khi viết code, không phải sau khi nộp</text>
</svg>
