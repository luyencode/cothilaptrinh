<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="1600" height="760" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">
  <rect width="1600" height="760" rx="28" fill="#f6f9fc"/>
  <rect x="1" y="1" width="1598" height="758" rx="28" fill="none" stroke="#e9ecf2" stroke-width="2"/>
  <text x="800" y="80" text-anchor="middle" font-size="40" font-weight="bold" fill="#1E3A63">Năm việc nên làm và năm việc không nên làm</text>
  <text x="800" y="126" text-anchor="middle" font-size="25" fill="#75849a">Gần như mọi sai lầm khi học cùng AI đều là vi phạm một trong mười dòng này</text>
  <rect x="80" y="176" width="680" height="506" rx="30" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <rect x="80" y="176" width="680" height="72" rx="30" fill="#1f8b3f"/>
  <rect x="80" y="218" width="680" height="30" fill="#1f8b3f"/>
  <text x="420" y="224" text-anchor="middle" font-size="29" font-weight="bold" fill="#ffffff">NÊN làm</text>
  <circle cx="126" cy="295" r="9" fill="#1f8b3f"/>
  <text x="156" y="304" font-size="25" fill="#1E3A63">Nhờ AI giải thích khái niệm chưa hiểu</text>
  <circle cx="126" cy="364" r="9" fill="#1f8b3f"/>
  <text x="156" y="373" font-size="25" fill="#1E3A63">Nhờ AI tạo câu hỏi, tự trả lời trước</text>
  <circle cx="126" cy="433" r="9" fill="#1f8b3f"/>
  <text x="156" y="442" font-size="25" fill="#1E3A63">Nhờ AI phản biện bài làm của mình</text>
  <circle cx="126" cy="502" r="9" fill="#1f8b3f"/>
  <text x="156" y="511" font-size="25" fill="#1E3A63">Nhờ AI lên kế hoạch học tập</text>
  <circle cx="126" cy="571" r="9" fill="#1f8b3f"/>
  <text x="156" y="580" font-size="25" fill="#1E3A63">Luôn tra lại bằng sách giáo khoa</text>
  <rect x="840" y="176" width="680" height="506" rx="30" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <rect x="840" y="176" width="680" height="72" rx="30" fill="#c0392b"/>
  <rect x="840" y="218" width="680" height="30" fill="#c0392b"/>
  <text x="1180" y="224" text-anchor="middle" font-size="29" font-weight="bold" fill="#ffffff">KHÔNG nên làm</text>
  <circle cx="886" cy="295" r="9" fill="#c0392b"/>
  <text x="916" y="304" font-size="25" fill="#1E3A63">Để AI viết toàn bộ bài tập thay mình</text>
  <circle cx="886" cy="364" r="9" fill="#c0392b"/>
  <text x="916" y="373" font-size="25" fill="#1E3A63">Chép câu trả lời mà không đọc, không hiểu</text>
  <circle cx="886" cy="433" r="9" fill="#c0392b"/>
  <text x="916" y="442" font-size="25" fill="#1E3A63">Tin AI tuyệt đối, không kiểm chứng</text>
  <circle cx="886" cy="502" r="9" fill="#c0392b"/>
  <text x="916" y="511" font-size="25" fill="#1E3A63">Dùng AI khi thi cử không được phép</text>
  <circle cx="886" cy="571" r="9" fill="#c0392b"/>
  <text x="916" y="580" font-size="25" fill="#1E3A63">Chia sẻ thông tin cá nhân nhạy cảm</text>
  <text x="800" y="730" text-anchor="middle" font-size="23" fill="#75849a">Cô Thi Lập Trình  |  cothilaptrinh.vn</text>
</svg>
