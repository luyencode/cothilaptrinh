<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 660" width="1600" height="660" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">
  <rect width="1600" height="660" rx="28" fill="#f6f9fc"/>
  <rect x="1" y="1" width="1598" height="658" rx="28" fill="none" stroke="#e9ecf2" stroke-width="2"/>
  <text x="800" y="78" text-anchor="middle" font-size="39" font-weight="bold" fill="#1E3A63">Ba kỹ thuật ghi nhớ có cơ sở khoa học</text>
  <text x="800" y="124" text-anchor="middle" font-size="24" fill="#75849a">Cả ba đều làm việc học khó hơn lúc làm, và dễ hơn hẳn lúc thi</text>
  <rect x="100" y="180" width="440" height="340" rx="30" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <rect x="100" y="180" width="440" height="10" rx="5" fill="#1f8b3f"/>
  <circle cx="320" cy="262" r="34" fill="#1f8b3f"/>
  <text x="320" y="275" text-anchor="middle" font-size="32" font-weight="bold" fill="#ffffff">1</text>
  <text x="320" y="344" text-anchor="middle" font-size="27" font-weight="bold" fill="#1f8b3f">Active Recall</text>
  <text x="320" y="384" text-anchor="middle" font-size="25" fill="#1E3A63">Tự gọi lại</text>
  <text x="320" y="444" text-anchor="middle" font-size="21" fill="#75849a">Bạn gấp sách và tự trả lời</text>
  <text x="320" y="474" text-anchor="middle" font-size="21" fill="#75849a">trước khi mở ra kiểm tra</text>
  <rect x="580" y="180" width="440" height="340" rx="30" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <rect x="580" y="180" width="440" height="10" rx="5" fill="#2e86c9"/>
  <circle cx="800" cy="262" r="34" fill="#2e86c9"/>
  <text x="800" y="275" text-anchor="middle" font-size="32" font-weight="bold" fill="#ffffff">2</text>
  <text x="800" y="344" text-anchor="middle" font-size="27" font-weight="bold" fill="#2e86c9">Spaced Repetition</text>
  <text x="800" y="384" text-anchor="middle" font-size="25" fill="#1E3A63">Ôn ngắt quãng</text>
  <text x="800" y="444" text-anchor="middle" font-size="21" fill="#75849a">Bạn ôn vào ngày 1, ngày 3,</text>
  <text x="800" y="474" text-anchor="middle" font-size="21" fill="#75849a">ngày 7 và ngày 14</text>
  <rect x="1060" y="180" width="440" height="340" rx="30" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <rect x="1060" y="180" width="440" height="10" rx="5" fill="#1f8b3f"/>
  <circle cx="1280" cy="262" r="34" fill="#1f8b3f"/>
  <text x="1280" y="275" text-anchor="middle" font-size="32" font-weight="bold" fill="#ffffff">3</text>
  <text x="1280" y="344" text-anchor="middle" font-size="27" font-weight="bold" fill="#1f8b3f">Interleaving</text>
  <text x="1280" y="384" text-anchor="middle" font-size="25" fill="#1E3A63">Học xen kẽ</text>
  <text x="1280" y="444" text-anchor="middle" font-size="21" fill="#75849a">Bạn trộn nhiều môn trong một</text>
  <text x="1280" y="474" text-anchor="middle" font-size="21" fill="#75849a">buổi, không cày một môn</text>
  <text x="800" y="632" text-anchor="middle" font-size="22" fill="#75849a">Cô Thi Lập Trình  |  cothilaptrinh.vn</text>
</svg>
