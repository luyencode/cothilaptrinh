<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" font-family="'DejaVu Sans', Arial, sans-serif">
  <rect x="0" y="0" width="1600" height="680" rx="28" fill="#f6f9fc"/>
  <text x="800" y="86" text-anchor="middle" font-size="38" font-weight="bold" fill="#1E3A63">Từ kỹ năng của một nghề thành kỹ năng của mọi nghề</text>

  <!-- ascending steps -->
  <rect x="140" y="420" width="380" height="150" rx="24" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <rect x="140" y="420" width="380" height="54" rx="24" fill="#62b4ec"/>
  <rect x="140" y="450" width="380" height="24" fill="#62b4ec"/>
  <text x="330" y="456" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">Những năm 1990</text>
  <text x="330" y="516" text-anchor="middle" font-size="26" font-weight="bold" fill="#1E3A63">Tiếng Anh</text>
  <text x="330" y="550" text-anchor="middle" font-size="20" fill="#75849a">lợi thế của số ít</text>

  <rect x="610" y="320" width="380" height="250" rx="24" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <rect x="610" y="320" width="380" height="54" rx="24" fill="#2e86c9"/>
  <rect x="610" y="350" width="380" height="24" fill="#2e86c9"/>
  <text x="800" y="356" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">Những năm 2000</text>
  <text x="800" y="426" text-anchor="middle" font-size="26" font-weight="bold" fill="#1E3A63">Tin học văn phòng</text>
  <text x="800" y="460" text-anchor="middle" font-size="20" fill="#75849a">điểm cộng trong hồ sơ</text>
  <text x="800" y="494" text-anchor="middle" font-size="20" fill="#75849a">rồi dần thành mặc định</text>

  <rect x="1080" y="220" width="380" height="350" rx="24" fill="#ffffff" stroke="#1f8b3f" stroke-width="3"/>
  <rect x="1080" y="220" width="380" height="54" rx="24" fill="#1f8b3f"/>
  <rect x="1080" y="250" width="380" height="24" fill="#1f8b3f"/>
  <text x="1270" y="256" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">Hôm nay</text>
  <text x="1270" y="330" text-anchor="middle" font-size="26" font-weight="bold" fill="#1f8b3f">Nền lập trình</text>
  <text x="1270" y="364" text-anchor="middle" font-size="26" font-weight="bold" fill="#1f8b3f">và dữ liệu</text>
  <text x="1270" y="410" text-anchor="middle" font-size="20" fill="#75849a">đang đi đúng con đường ấy,</text>
  <text x="1270" y="440" text-anchor="middle" font-size="20" fill="#75849a">chỉ nhanh hơn</text>
  <text x="1270" y="500" text-anchor="middle" font-size="21" font-weight="bold" fill="#1E3A63">kỹ năng nền của mọi nghề</text>

  <!-- arrow -->
  <line x1="200" y1="180" x2="1000" y2="180" stroke="#F2C13D" stroke-width="8" stroke-linecap="round"/>
  <path d="M1000 158 L1044 180 L1000 202 Z" fill="#F2C13D"/>
  <text x="620" y="150" text-anchor="middle" font-size="22" fill="#75849a">mức độ phổ cập tăng dần theo thời gian</text>
</svg>
