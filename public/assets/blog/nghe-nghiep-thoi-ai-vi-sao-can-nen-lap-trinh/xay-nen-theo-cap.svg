<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" font-family="'DejaVu Sans', Arial, sans-serif">
  <rect x="0" y="0" width="1600" height="680" rx="28" fill="#f6f9fc"/>
  <text x="800" y="86" text-anchor="middle" font-size="38" font-weight="bold" fill="#1E3A63">Xây nền theo cấp học, mỗi tuần 2-3 buổi</text>

  <rect x="110" y="180" width="400" height="360" rx="26" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <rect x="110" y="180" width="400" height="80" rx="26" fill="#1f8b3f"/>
  <rect x="110" y="230" width="400" height="30" fill="#1f8b3f"/>
  <text x="310" y="232" text-anchor="middle" font-size="30" font-weight="bold" fill="#ffffff">TIỂU HỌC</text>
  <text x="310" y="316" text-anchor="middle" font-size="27" font-weight="bold" fill="#1E3A63">Scratch</text>
  <text x="310" y="360" text-anchor="middle" font-size="21" fill="#75849a">khối lệnh kéo thả</text>
  <text x="310" y="392" text-anchor="middle" font-size="21" fill="#75849a">tư duy tuần tự, vòng lặp</text>
  <text x="310" y="424" text-anchor="middle" font-size="21" fill="#75849a">niềm vui tạo ra sản phẩm</text>
  <rect x="200" y="460" width="220" height="46" rx="14" fill="#eef7f0"/>
  <text x="310" y="490" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f8b3f">6-10 tuổi</text>

  <line x1="530" y1="360" x2="580" y2="360" stroke="#75849a" stroke-width="6" stroke-linecap="round"/>
  <path d="M580 344 L610 360 L580 376 Z" fill="#75849a"/>

  <rect x="630" y="180" width="400" height="360" rx="26" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <rect x="630" y="180" width="400" height="80" rx="26" fill="#2e86c9"/>
  <rect x="630" y="230" width="400" height="30" fill="#2e86c9"/>
  <text x="830" y="232" text-anchor="middle" font-size="30" font-weight="bold" fill="#ffffff">THCS</text>
  <text x="830" y="316" text-anchor="middle" font-size="27" font-weight="bold" fill="#1E3A63">Python</text>
  <text x="830" y="360" text-anchor="middle" font-size="21" fill="#75849a">ngôn ngữ dạng chữ</text>
  <text x="830" y="392" text-anchor="middle" font-size="21" fill="#75849a">biến, hàm, vòng lặp</text>
  <text x="830" y="424" text-anchor="middle" font-size="21" fill="#75849a">dự án nhỏ có ý nghĩa</text>
  <rect x="720" y="460" width="220" height="46" rx="14" fill="#eef4fb"/>
  <text x="830" y="490" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e86c9">11-14 tuổi</text>

  <line x1="1050" y1="360" x2="1100" y2="360" stroke="#75849a" stroke-width="6" stroke-linecap="round"/>
  <path d="M1100 344 L1130 360 L1100 376 Z" fill="#75849a"/>

  <rect x="1150" y="180" width="340" height="360" rx="26" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <rect x="1150" y="180" width="340" height="80" rx="26" fill="#1E3A63"/>
  <rect x="1150" y="230" width="340" height="30" fill="#1E3A63"/>
  <text x="1320" y="232" text-anchor="middle" font-size="30" font-weight="bold" fill="#F2C13D">THPT</text>
  <text x="1320" y="316" text-anchor="middle" font-size="27" font-weight="bold" fill="#1E3A63">Dữ liệu và AI</text>
  <text x="1320" y="360" text-anchor="middle" font-size="21" fill="#75849a">phân tích dữ liệu</text>
  <text x="1320" y="392" text-anchor="middle" font-size="21" fill="#75849a">hiểu cách AI vận hành</text>
  <text x="1320" y="424" text-anchor="middle" font-size="21" fill="#75849a">dự án thật, thi thật</text>
  <rect x="1210" y="460" width="220" height="46" rx="14" fill="#fdf7e6"/>
  <text x="1320" y="490" text-anchor="middle" font-size="20" font-weight="bold" fill="#b8860b">15-18 tuổi</text>

  <text x="800" y="612" text-anchor="middle" font-size="24" fill="#75849a">Tư duy trước, công cụ sau: học đều quan trọng hơn học nhiều</text>
</svg>
