<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" font-family="'DejaVu Sans', Arial, sans-serif">
  <rect x="0" y="0" width="1600" height="680" rx="28" fill="#f6f9fc"/>
  <text x="800" y="86" text-anchor="middle" font-size="38" font-weight="bold" fill="#1E3A63">AI đang có mặt trong mọi ngành nghề</text>

  <!-- connecting lines -->
  <line x1="800" y1="360" x2="330" y2="220" stroke="#e9ecf2" stroke-width="5"/>
  <line x1="800" y1="360" x2="330" y2="370" stroke="#e9ecf2" stroke-width="5"/>
  <line x1="800" y1="360" x2="330" y2="520" stroke="#e9ecf2" stroke-width="5"/>
  <line x1="800" y1="360" x2="1270" y2="220" stroke="#e9ecf2" stroke-width="5"/>
  <line x1="800" y1="360" x2="1270" y2="370" stroke="#e9ecf2" stroke-width="5"/>
  <line x1="800" y1="360" x2="1270" y2="520" stroke="#e9ecf2" stroke-width="5"/>

  <!-- center AI node -->
  <rect x="700" y="260" width="200" height="200" rx="32" fill="#1f8b3f"/>
  <rect x="730" y="290" width="140" height="140" rx="22" fill="#ffffff" opacity="0.15"/>
  <text x="800" y="378" text-anchor="middle" font-size="64" font-weight="bold" fill="#ffffff">AI</text>

  <!-- left cards -->
  <rect x="90" y="175" width="240" height="90" rx="20" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <text x="210" y="215" text-anchor="middle" font-size="24" font-weight="bold" fill="#1E3A63">Y tế</text>
  <text x="210" y="246" text-anchor="middle" font-size="19" fill="#75849a">đọc phim, sàng lọc</text>

  <rect x="90" y="325" width="240" height="90" rx="20" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <text x="210" y="365" text-anchor="middle" font-size="24" font-weight="bold" fill="#1E3A63">Tài chính</text>
  <text x="210" y="396" text-anchor="middle" font-size="19" fill="#75849a">chấm điểm hồ sơ</text>

  <rect x="90" y="475" width="240" height="90" rx="20" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <text x="210" y="515" text-anchor="middle" font-size="24" font-weight="bold" fill="#1E3A63">Nông nghiệp</text>
  <text x="210" y="546" text-anchor="middle" font-size="19" fill="#75849a">cảm biến, dự báo</text>

  <!-- right cards -->
  <rect x="1270" y="175" width="240" height="90" rx="20" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <text x="1390" y="215" text-anchor="middle" font-size="24" font-weight="bold" fill="#1E3A63">Truyền thông</text>
  <text x="1390" y="246" text-anchor="middle" font-size="19" fill="#75849a">nội dung, số liệu</text>

  <rect x="1270" y="325" width="240" height="90" rx="20" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <text x="1390" y="365" text-anchor="middle" font-size="24" font-weight="bold" fill="#1E3A63">Giáo dục</text>
  <text x="1390" y="396" text-anchor="middle" font-size="19" fill="#75849a">học liệu cá nhân hóa</text>

  <rect x="1270" y="475" width="240" height="90" rx="20" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <text x="1390" y="515" text-anchor="middle" font-size="24" font-weight="bold" fill="#1E3A63">Luật, kế toán</text>
  <text x="1390" y="546" text-anchor="middle" font-size="19" fill="#75849a">rà soát, đối chiếu</text>

  <!-- stat badge -->
  <rect x="520" y="540" width="560" height="76" rx="22" fill="#1E3A63"/>
  <text x="800" y="572" text-anchor="middle" font-size="24" font-weight="bold" fill="#F2C13D">170 triệu việc làm mới đến 2030</text>
  <text x="800" y="602" text-anchor="middle" font-size="19" fill="#dbe7f3">theo Future of Jobs 2025, Diễn đàn Kinh tế Thế giới</text>
</svg>
