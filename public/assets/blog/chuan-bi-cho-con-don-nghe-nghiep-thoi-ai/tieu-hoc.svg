<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" font-family="'DejaVu Sans', Arial, sans-serif">
  <rect x="0" y="0" width="1600" height="680" rx="28" fill="#f6f9fc"/>
  <text x="800" y="86" text-anchor="middle" font-size="38" font-weight="bold" fill="#1E3A63">Tiểu học: gieo hạt, không thúc ép</text>

  <!-- man hinh tao ra -->
  <rect x="130" y="160" width="420" height="380" rx="26" fill="#ffffff" stroke="#1f8b3f" stroke-width="3"/>
  <text x="340" y="226" text-anchor="middle" font-size="25" font-weight="bold" fill="#1f8b3f">Giờ màn hình TẠO RA</text>
  <rect x="200" y="270" width="280" height="44" rx="12" fill="#1f8b3f"/>
  <text x="340" y="298" text-anchor="middle" font-size="20" fill="#ffffff">làm game Scratch</text>
  <rect x="200" y="330" width="280" height="44" rx="12" fill="#2e86c9"/>
  <text x="340" y="358" text-anchor="middle" font-size="20" fill="#ffffff">vẽ, viết, dựng chuyện</text>
  <rect x="200" y="390" width="280" height="44" rx="12" fill="#62b4ec"/>
  <text x="340" y="418" text-anchor="middle" font-size="20" fill="#ffffff">khoe sản phẩm với cả nhà</text>
  <text x="340" y="500" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f8b3f">khuyến khích</text>

  <!-- man hinh tieu thu -->
  <rect x="590" y="160" width="420" height="380" rx="26" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <text x="800" y="226" text-anchor="middle" font-size="25" font-weight="bold" fill="#75849a">Giờ màn hình TIÊU THỤ</text>
  <rect x="660" y="270" width="280" height="44" rx="12" fill="#e9ecf2"/>
  <text x="800" y="298" text-anchor="middle" font-size="20" fill="#75849a">xem video liên tục</text>
  <rect x="660" y="330" width="280" height="44" rx="12" fill="#e9ecf2"/>
  <text x="800" y="358" text-anchor="middle" font-size="20" fill="#75849a">lướt không chủ đích</text>
  <rect x="660" y="390" width="280" height="44" rx="12" fill="#e9ecf2"/>
  <text x="800" y="418" text-anchor="middle" font-size="20" fill="#75849a">chơi game thụ động</text>
  <text x="800" y="500" text-anchor="middle" font-size="22" font-weight="bold" fill="#75849a">giới hạn có chủ đích</text>

  <!-- khong can may -->
  <rect x="1050" y="160" width="420" height="380" rx="26" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <text x="1260" y="226" text-anchor="middle" font-size="25" font-weight="bold" fill="#1E3A63">Bài học không cần máy</text>
  <rect x="1120" y="270" width="280" height="44" rx="12" fill="#eef7f0"/>
  <text x="1260" y="298" text-anchor="middle" font-size="20" fill="#1f8b3f">đọc sách mỗi ngày</text>
  <rect x="1120" y="330" width="280" height="44" rx="12" fill="#eef4fb"/>
  <text x="1260" y="358" text-anchor="middle" font-size="20" fill="#2e86c9">chơi cờ, trò giải đố</text>
  <rect x="1120" y="390" width="280" height="44" rx="12" fill="#fdf7e6"/>
  <text x="1260" y="418" text-anchor="middle" font-size="20" fill="#b8860b">đặt câu hỏi vì sao</text>
  <text x="1260" y="500" text-anchor="middle" font-size="22" font-weight="bold" fill="#1E3A63">nuôi tư duy nền</text>

  <text x="800" y="612" text-anchor="middle" font-size="24" fill="#75849a">Mục tiêu duy nhất: con thích tạo ra thứ gì đó bằng máy tính</text>
</svg>
