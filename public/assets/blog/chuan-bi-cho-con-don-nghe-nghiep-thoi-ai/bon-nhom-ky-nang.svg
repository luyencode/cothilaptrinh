<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" font-family="'DejaVu Sans', Arial, sans-serif">
  <rect x="0" y="0" width="1600" height="680" rx="28" fill="#f6f9fc"/>
  <text x="800" y="86" text-anchor="middle" font-size="38" font-weight="bold" fill="#1E3A63">Bốn nhóm kỹ năng cho mọi tương lai</text>

  <rect x="150" y="140" width="620" height="220" rx="24" fill="#1f8b3f"/>
  <text x="460" y="216" text-anchor="middle" font-size="28" font-weight="bold" fill="#ffffff">1. Nền lập trình và dữ liệu</text>
  <text x="460" y="260" text-anchor="middle" font-size="21" fill="#eef7f0">tư duy phân rã, đọc hiểu logic,</text>
  <text x="460" y="292" text-anchor="middle" font-size="21" fill="#eef7f0">làm việc với con số</text>

  <rect x="830" y="140" width="620" height="220" rx="24" fill="#2e86c9"/>
  <text x="1140" y="216" text-anchor="middle" font-size="28" font-weight="bold" fill="#ffffff">2. Dùng AI đúng cách</text>
  <text x="1140" y="260" text-anchor="middle" font-size="21" fill="#eef4fb">giao việc rõ ràng, kiểm tra kết quả,</text>
  <text x="1140" y="292" text-anchor="middle" font-size="21" fill="#eef4fb">biết lúc nào không nên tin máy</text>

  <rect x="150" y="400" width="620" height="220" rx="24" fill="#1E3A63"/>
  <text x="460" y="476" text-anchor="middle" font-size="28" font-weight="bold" fill="#F2C13D">3. Giải quyết vấn đề</text>
  <text x="460" y="520" text-anchor="middle" font-size="21" fill="#dbe7f3">dám thử, biết chia nhỏ,</text>
  <text x="460" y="552" text-anchor="middle" font-size="21" fill="#dbe7f3">kiên trì sửa sai</text>

  <rect x="830" y="400" width="620" height="220" rx="24" fill="#F2C13D"/>
  <text x="1140" y="476" text-anchor="middle" font-size="28" font-weight="bold" fill="#13294a">4. Kỹ năng con người</text>
  <text x="1140" y="520" text-anchor="middle" font-size="21" fill="#13294a">giao tiếp, cộng tác,</text>
  <text x="1140" y="552" text-anchor="middle" font-size="21" fill="#13294a">sáng tạo, thấu cảm</text>
</svg>
