<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" width="1600" height="680" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">
  <rect width="1600" height="680" rx="28" fill="#f6f9fc"/>
  <rect x="1" y="1" width="1598" height="678" rx="28" fill="none" stroke="#e9ecf2" stroke-width="2"/>
  <text x="800" y="76" text-anchor="middle" font-size="38" font-weight="bold" fill="#1E3A63">Năm bước cài Code::Blocks trên Windows</text>
  <text x="800" y="120" text-anchor="middle" font-size="23" fill="#75849a">Bạn làm xong bước này mới sang bước kế tiếp</text>

  <rect x="68" y="180" width="280" height="330" rx="24" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <rect x="68" y="180" width="280" height="10" rx="5" fill="#2e86c9"/>
  <circle cx="208" cy="252" r="34" fill="#eaf3fb"/>
  <text x="208" y="264" text-anchor="middle" font-size="32" font-weight="bold" fill="#2e86c9">1</text>
  <text x="208" y="322" text-anchor="middle" font-size="23" font-weight="bold" fill="#1E3A63">Tải bộ cài</text>
  <text x="208" y="366" text-anchor="middle" font-size="19" fill="#75849a">Bạn vào trang chính</text>
  <text x="208" y="394" text-anchor="middle" font-size="19" fill="#75849a">thức, chọn file có</text>
  <text x="208" y="422" text-anchor="middle" font-size="19" fill="#75849a">chữ mingw</text>

  <rect x="364" y="180" width="280" height="330" rx="24" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <rect x="364" y="180" width="280" height="10" rx="5" fill="#2e86c9"/>
  <circle cx="504" cy="252" r="34" fill="#eaf3fb"/>
  <text x="504" y="264" text-anchor="middle" font-size="32" font-weight="bold" fill="#2e86c9">2</text>
  <text x="504" y="322" text-anchor="middle" font-size="23" font-weight="bold" fill="#1E3A63">Chạy bộ cài</text>
  <text x="504" y="366" text-anchor="middle" font-size="19" fill="#75849a">Bạn bấm chuột phải,</text>
  <text x="504" y="394" text-anchor="middle" font-size="19" fill="#75849a">chọn Run as</text>
  <text x="504" y="422" text-anchor="middle" font-size="19" fill="#75849a">administrator</text>

  <rect x="660" y="180" width="280" height="330" rx="24" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <rect x="660" y="180" width="280" height="10" rx="5" fill="#1f8b3f"/>
  <circle cx="800" cy="252" r="34" fill="#eaf6ee"/>
  <text x="800" y="264" text-anchor="middle" font-size="32" font-weight="bold" fill="#1f8b3f">3</text>
  <text x="800" y="322" text-anchor="middle" font-size="23" font-weight="bold" fill="#1E3A63">Chọn Full</text>
  <text x="800" y="366" text-anchor="middle" font-size="19" fill="#75849a">Bạn giữ nguyên kiểu</text>
  <text x="800" y="394" text-anchor="middle" font-size="19" fill="#75849a">cài Full để có đủ</text>
  <text x="800" y="422" text-anchor="middle" font-size="19" fill="#75849a">trình biên dịch</text>

  <rect x="956" y="180" width="280" height="330" rx="24" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <rect x="956" y="180" width="280" height="10" rx="5" fill="#1f8b3f"/>
  <circle cx="1096" cy="252" r="34" fill="#eaf6ee"/>
  <text x="1096" y="264" text-anchor="middle" font-size="32" font-weight="bold" fill="#1f8b3f">4</text>
  <text x="1096" y="322" text-anchor="middle" font-size="23" font-weight="bold" fill="#1E3A63">Chọn ổ đĩa</text>
  <text x="1096" y="366" text-anchor="middle" font-size="19" fill="#75849a">Bạn để đường dẫn</text>
  <text x="1096" y="394" text-anchor="middle" font-size="19" fill="#75849a">cài mặc định, không</text>
  <text x="1096" y="422" text-anchor="middle" font-size="19" fill="#75849a">có dấu tiếng Việt</text>

  <rect x="1252" y="180" width="280" height="330" rx="24" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <rect x="1252" y="180" width="280" height="10" rx="5" fill="#F2C13D"/>
  <circle cx="1392" cy="252" r="34" fill="#fdf5e0"/>
  <text x="1392" y="264" text-anchor="middle" font-size="32" font-weight="bold" fill="#c9971f">5</text>
  <text x="1392" y="322" text-anchor="middle" font-size="23" font-weight="bold" fill="#1E3A63">Nhận compiler</text>
  <text x="1392" y="366" text-anchor="middle" font-size="19" fill="#75849a">Lần mở đầu tiên,</text>
  <text x="1392" y="394" text-anchor="middle" font-size="19" fill="#75849a">bạn chọn GNU GCC</text>
  <text x="1392" y="422" text-anchor="middle" font-size="19" fill="#75849a">rồi bấm OK</text>

  <rect x="68" y="546" width="1464" height="72" rx="20" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <rect x="68" y="546" width="10" height="72" rx="5" fill="#2e86c9"/>
  <text x="110" y="580" font-size="21" font-weight="bold" fill="#1E3A63">Cách kiểm tra máy đã có trình biên dịch</text>
  <text x="110" y="608" font-size="20" fill="#75849a">Bạn mở Settings, chọn Compiler, xem mục Toolchain executables có đường dẫn tới thư mục MinGW hay chưa</text>
  <text x="1520" y="664" text-anchor="end" font-size="20" fill="#75849a" opacity="0.55">cothilaptrinh.vn</text>
</svg>
