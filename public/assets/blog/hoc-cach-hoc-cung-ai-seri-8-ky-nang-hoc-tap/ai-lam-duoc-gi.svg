  <circle cx="886" cy="439" r="9" fill="#1f8b3f"/>
  <text x="916" y="448" font-size="25" fill="#1E3A63">Việc luyện: số lần chính tay mình làm</text>
  <circle cx="886" cy="511" r="9" fill="#1f8b3f"/>
  <text x="916" y="520" font-size="25" fill="#1E3A63">Việc thi: một mình trong phòng thi</text>
  <text x="800" y="670" text-anchor="middle" font-size="23" fill="#75849a">Cô Thi Lập Trình  |  cothilaptrinh.vn</text>
