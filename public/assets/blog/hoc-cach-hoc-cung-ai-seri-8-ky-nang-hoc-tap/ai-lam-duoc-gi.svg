<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">
  <rect width="1600" height="700" rx="28" fill="#f6f9fc"/>
  <rect x="1" y="1" width="1598" height="698" rx="28" fill="none" stroke="#e9ecf2" stroke-width="2"/>
  <text x="800" y="80" text-anchor="middle" font-size="40" font-weight="bold" fill="#1E3A63">AI làm được gì và học sinh phải tự làm gì</text>
  <text x="800" y="126" text-anchor="middle" font-size="25" fill="#75849a">Chia đúng ranh giới là điều kiện đầu tiên để học cùng AI có kết quả</text>
  <rect x="80" y="176" width="680" height="446" rx="30" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <rect x="80" y="176" width="680" height="72" rx="30" fill="#2e86c9"/>
  <rect x="80" y="218" width="680" height="30" fill="#2e86c9"/>
  <text x="420" y="224" text-anchor="middle" font-size="29" font-weight="bold" fill="#ffffff">AI làm rất tốt</text>
  <circle cx="126" cy="295" r="9" fill="#2e86c9"/>
  <text x="156" y="304" font-size="25" fill="#1E3A63">Giải thích lại khái niệm nhiều cách</text>
  <circle cx="126" cy="367" r="9" fill="#2e86c9"/>
  <text x="156" y="376" font-size="25" fill="#1E3A63">Ra câu hỏi luyện tập không cạn</text>
  <circle cx="126" cy="439" r="9" fill="#2e86c9"/>
  <text x="156" y="448" font-size="25" fill="#1E3A63">Phản biện bài làm, chỉ chỗ còn yếu</text>
  <circle cx="126" cy="511" r="9" fill="#2e86c9"/>
  <text x="156" y="520" font-size="25" fill="#1E3A63">Phân tích lịch học và gợi ý sửa</text>
  <rect x="840" y="176" width="680" height="446" rx="30" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <rect x="840" y="176" width="680" height="72" rx="30" fill="#1f8b3f"/>
  <rect x="840" y="218" width="680" height="30" fill="#1f8b3f"/>
  <text x="1180" y="224" text-anchor="middle" font-size="29" font-weight="bold" fill="#ffffff">Chỉ mình làm được</text>
  <circle cx="886" cy="295" r="9" fill="#1f8b3f"/>
  <text x="916" y="304" font-size="25" fill="#1E3A63">Việc nhớ: tự cố gắng nhớ lại</text>
  <circle cx="886" cy="367" r="9" fill="#1f8b3f"/>
