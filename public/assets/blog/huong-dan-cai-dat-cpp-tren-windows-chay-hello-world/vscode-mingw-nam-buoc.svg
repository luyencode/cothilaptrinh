<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" width="1600" height="680" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">
  <rect width="1600" height="680" rx="28" fill="#f6f9fc"/>
  <rect x="1" y="1" width="1598" height="678" rx="28" fill="none" stroke="#e9ecf2" stroke-width="2"/>
  <text x="800" y="76" text-anchor="middle" font-size="38" font-weight="bold" fill="#1E3A63">Cài VS Code với MinGW-w64 theo năm bước</text>
  <text x="800" y="120" text-anchor="middle" font-size="23" fill="#75849a">Bạn làm đúng thứ tự, mỗi bước xong mới sang bước sau</text>

  <rect x="80" y="180" width="1420" height="86" rx="22" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <circle cx="136" cy="223" r="26" fill="#1E3A63"/>
  <text x="136" y="233" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">1</text>
  <text x="190" y="215" font-size="23" font-weight="bold" fill="#1E3A63">Cài Visual Studio Code</text>
  <text x="190" y="248" font-size="20" fill="#75849a">Bạn tải từ code.visualstudio.com rồi cài như phần mềm thường</text>

  <rect x="80" y="282" width="1420" height="86" rx="22" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <circle cx="136" cy="325" r="26" fill="#1E3A63"/>
  <text x="136" y="335" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">2</text>
  <text x="190" y="317" font-size="23" font-weight="bold" fill="#1E3A63">Cài tiện ích C/C++ của Microsoft</text>
  <text x="190" y="350" font-size="20" fill="#75849a">Bạn mở mục Extensions, gõ C++, chọn tiện ích của Microsoft rồi bấm Install</text>

  <rect x="80" y="384" width="1420" height="86" rx="22" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <circle cx="136" cy="427" r="26" fill="#1f8b3f"/>
  <text x="136" y="437" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">3</text>
  <text x="190" y="419" font-size="23" font-weight="bold" fill="#1E3A63">Cài trình biên dịch MinGW-w64</text>
  <text x="190" y="452" font-size="20" fill="#75849a">Bạn cài qua MSYS2, hoặc tải bản đóng gói sẵn ở winlibs.com rồi giải nén</text>

  <rect x="80" y="486" width="1420" height="86" rx="22" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <circle cx="136" cy="529" r="26" fill="#1f8b3f"/>
  <text x="136" y="539" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">4</text>
  <text x="190" y="521" font-size="23" font-weight="bold" fill="#1E3A63">Thêm thư mục bin vào biến môi trường Path</text>
  <text x="190" y="554" font-size="20" fill="#75849a">Windows nhờ dòng này mới tìm thấy lệnh dịch code ở mọi thư mục</text>

  <rect x="80" y="588" width="1420" height="60" rx="22" fill="#13294a"/>
  <circle cx="136" cy="618" r="22" fill="#F2C13D"/>
  <text x="136" y="627" text-anchor="middle" font-size="23" font-weight="bold" fill="#13294a">5</text>
  <text x="190" y="626" font-size="22" font-weight="bold" fill="#ffffff">Mở Command Prompt, gõ g++ --version để kiểm tra máy đã nhận</text>
  <text x="1470" y="672" text-anchor="end" font-size="20" fill="#75849a" opacity="0.55">cothilaptrinh.vn</text>
</svg>
