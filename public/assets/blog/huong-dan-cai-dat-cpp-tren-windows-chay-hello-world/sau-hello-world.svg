<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" width="1600" height="620" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">
  <rect width="1600" height="620" rx="28" fill="#f6f9fc"/>
  <rect x="1" y="1" width="1598" height="618" rx="28" fill="none" stroke="#e9ecf2" stroke-width="2"/>
  <text x="800" y="76" text-anchor="middle" font-size="38" font-weight="bold" fill="#1E3A63">Sau Hello World, bạn đi tiếp theo thứ tự nào</text>
  <text x="800" y="120" text-anchor="middle" font-size="23" fill="#75849a">Bốn chặng đầu tiên của người mới học C++</text>

  <rect x="80" y="180" width="330" height="250" rx="24" fill="#2e86c9"/>
  <text x="245" y="238" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">Chặng 1</text>
  <text x="245" y="292" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">In ra màn hình</text>
  <text x="245" y="340" text-anchor="middle" font-size="20" fill="#ffffff" opacity="0.92">Bạn in chữ, in số</text>
  <text x="245" y="372" text-anchor="middle" font-size="20" fill="#ffffff" opacity="0.92">và xuống dòng</text>

  <rect x="440" y="180" width="330" height="250" rx="24" fill="#1f8b3f"/>
  <text x="605" y="238" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">Chặng 2</text>
  <text x="605" y="292" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">Nhập và tính</text>
  <text x="605" y="340" text-anchor="middle" font-size="20" fill="#ffffff" opacity="0.92">Bạn dùng cin, biến</text>
  <text x="605" y="372" text-anchor="middle" font-size="20" fill="#ffffff" opacity="0.92">và bốn phép tính</text>

  <rect x="800" y="180" width="330" height="250" rx="24" fill="#1E3A63"/>
  <text x="965" y="238" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">Chặng 3</text>
  <text x="965" y="292" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">Điều kiện, vòng lặp</text>
  <text x="965" y="340" text-anchor="middle" font-size="20" fill="#ffffff" opacity="0.92">Bạn viết if và for</text>
  <text x="965" y="372" text-anchor="middle" font-size="20" fill="#ffffff" opacity="0.92">cho bài nhiều bước</text>

  <rect x="1160" y="180" width="330" height="250" rx="24" fill="#F2C13D"/>
  <text x="1325" y="238" text-anchor="middle" font-size="26" font-weight="bold" fill="#13294a">Chặng 4</text>
  <text x="1325" y="292" text-anchor="middle" font-size="22" font-weight="bold" fill="#13294a">Nộp bài có chấm</text>
  <text x="1325" y="340" text-anchor="middle" font-size="20" fill="#13294a" opacity="0.92">Bạn luyện trên hệ</text>
  <text x="1325" y="372" text-anchor="middle" font-size="20" fill="#13294a" opacity="0.92">thống chấm tự động</text>

  <rect x="240" y="472" width="1120" height="70" rx="22" fill="#ffffff" stroke="#F2C13D" stroke-width="3"/>
  <text x="800" y="516" text-anchor="middle" font-size="24" font-weight="bold" fill="#1E3A63">Bạn viết được chương trình đọc số và in kết quả là đã qua chặng nhập môn</text>
  <text x="1520" y="596" text-anchor="end" font-size="20" fill="#75849a" opacity="0.55">cothilaptrinh.vn</text>
</svg>
