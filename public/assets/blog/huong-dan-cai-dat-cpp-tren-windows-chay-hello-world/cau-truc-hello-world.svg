<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" width="1600" height="680" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">
  <rect width="1600" height="680" rx="28" fill="#f6f9fc"/>
  <rect x="1" y="1" width="1598" height="678" rx="28" fill="none" stroke="#e9ecf2" stroke-width="2"/>
  <text x="800" y="76" text-anchor="middle" font-size="38" font-weight="bold" fill="#1E3A63">Chương trình Hello World gồm những phần nào</text>
  <text x="800" y="120" text-anchor="middle" font-size="23" fill="#75849a">Bạn hiểu bốn phần này là đọc được mọi chương trình C++ về sau</text>

  <rect x="80" y="170" width="700" height="400" rx="24" fill="#13294a"/>
  <text x="120" y="228" font-size="24" font-family="DejaVu Sans Mono, Courier New, monospace" fill="#62b4ec">#include &lt;iostream&gt;</text>
  <text x="120" y="272" font-size="24" font-family="DejaVu Sans Mono, Courier New, monospace" fill="#8fa6bf">using namespace std;</text>
  <text x="120" y="338" font-size="24" font-family="DejaVu Sans Mono, Courier New, monospace" fill="#F2C13D">int main() {</text>
  <text x="152" y="382" font-size="24" font-family="DejaVu Sans Mono, Courier New, monospace" fill="#ffffff">cout &lt;&lt; "Hello World";</text>
  <text x="152" y="426" font-size="24" font-family="DejaVu Sans Mono, Courier New, monospace" fill="#9fe0b4">return 0;</text>
  <text x="120" y="470" font-size="24" font-family="DejaVu Sans Mono, Courier New, monospace" fill="#F2C13D">}</text>
  <text x="120" y="534" font-size="19" fill="#b7c6dd">Bạn gõ lại từng dòng thay vì sao chép</text>

  <rect x="820" y="170" width="680" height="88" rx="20" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <rect x="820" y="170" width="10" height="88" rx="5" fill="#2e86c9"/>
  <text x="856" y="206" font-size="22" font-weight="bold" fill="#1E3A63">Dòng include</text>
  <text x="856" y="238" font-size="20" fill="#75849a">Chương trình mượn công cụ nhập xuất có sẵn</text>

  <rect x="820" y="274" width="680" height="88" rx="20" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <rect x="820" y="274" width="10" height="88" rx="5" fill="#2e86c9"/>
  <text x="856" y="310" font-size="22" font-weight="bold" fill="#1E3A63">Dòng using namespace std</text>
  <text x="856" y="342" font-size="20" fill="#75849a">Dòng này cho phép viết cout thay vì std::cout</text>

  <rect x="820" y="378" width="680" height="88" rx="20" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <rect x="820" y="378" width="10" height="88" rx="5" fill="#1f8b3f"/>
  <text x="856" y="414" font-size="22" font-weight="bold" fill="#1E3A63">Hàm main</text>
  <text x="856" y="446" font-size="20" fill="#75849a">Máy luôn bắt đầu chạy chương trình từ đây</text>

  <rect x="820" y="482" width="680" height="88" rx="20" fill="#ffffff" stroke="#e9ecf2" stroke-width="2"/>
  <rect x="820" y="482" width="10" height="88" rx="5" fill="#F2C13D"/>
  <text x="856" y="518" font-size="22" font-weight="bold" fill="#1E3A63">Lệnh cout và return 0</text>
  <text x="856" y="550" font-size="20" fill="#75849a">Một lệnh in ra màn hình, một lệnh báo đã chạy xong</text>

  <text x="800" y="626" text-anchor="middle" font-size="23" font-weight="bold" fill="#1E3A63">Mỗi lệnh kết thúc bằng dấu chấm phẩy, thiếu một dấu là báo lỗi</text>
  <text x="1520" y="662" text-anchor="end" font-size="20" fill="#75849a" opacity="0.55">cothilaptrinh.vn</text>
</svg>
